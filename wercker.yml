box: node:5

build:
  steps:

    - script:
        name: echo nodejs information
        code: |
          echo "node version $(node -v) running"
          echo "npm version $(npm -v) running"
  
    - script:
        name: install-packages
        code: |
          apt-get update
    - script:
        name: setup node env
        code: |
          export NODE_ENV=production

    - npm-install:
        cwd: frontend/
    - script:
        name: webpack assets
        cwd: frontend/
        code: |
          npm run production
          
    - npm-install:
        cwd: backend/
    - npm-test:
        cwd: backend/
          
push-release:
  steps:
    - internal/docker-push:
        username: $USERNAME
        password: $PASSWORD
        repository: marcelofs/nodejs-web-boilerplate
        ports: "3000"
        working-dir: backend/
        cmd: npm start
